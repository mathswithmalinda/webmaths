<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Link Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow rounded-4 border-0 p-4">
            <h2 class="fw-bolder text-primary mb-4">Link Management System</h2>
            
            <div class="mb-4">
                <label class="fw-bold">Select Grade:</label>
                <select id="gradeSelect" class="form-select form-select-lg mt-2">
                    <option value="grade06">Grade 06</option>
                    <option value="grade07">Grade 07</option>
                    <option value="grade08">Grade 08</option>
                    <option value="grade09">Grade 09</option>
                    <option value="grade10">Grade 10</option>
                    <option value="grade11" selected>Grade 11</option>
                </select>
            </div>

            <hr>

            <div id="adminLinksContainer" class="row">
                </div>
        </div>
    </div>

    <div class="modal fade" id="replaceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Link</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editKey">
                    <div class="mb-3">
                        <label>Title</label>
                        <input type="text" id="editTitle" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>New URL</label>
                        <input type="text" id="editUrl" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Expires At</label>
                        <input type="datetime-local" id="editExpiry" class="form-control">
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="editActive">
                        <label class="form-check-label">Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveChangesBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="admin-logic.js"></script>
</body>
</html>
