<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, maximum-scale=1.0, user-scalable=no">
    <title>Video Player - ආදරණීය ගණිතය පන්තිය</title>
    
    <!-- iOS / Safari & PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="pic2.jpg" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06070a;
            --card-bg: rgba(15, 17, 26, 0.75);
            --accent-color: #7b2cbf;
            --control-bg: rgba(0, 0, 0, 0.65);
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
        }

        /* Enhanced Deep Purple Ambient Mesh Background */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 30%, rgba(147, 51, 234, 0.45) 0%, transparent 45%),
                        radial-gradient(circle at 80% 70%, rgba(30, 64, 175, 0.45) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(126, 34, 206, 0.35) 0%, transparent 50%);
            filter: blur(60px);
            z-index: -1;
            animation: meshShiftGlowing 12s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes meshShiftGlowing {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translate(-4%, 5%) scale(1.08);
                opacity: 1;
            }
            100% {
                transform: translate(5%, -4%) scale(0.95);
                opacity: 0.85;
            }
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            position: relative;
            z-index: 1;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .header-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 0.3px;
        }

        .player-container {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(147, 51, 234, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
        }

        /* Auto-Hide Controls Transition */
        .top-controls-bar, .center-controls {
            transition: opacity 0.3s ease, visibility 0.3s ease;
            opacity: 1;
            visibility: visible;
        }

        .hide-controls .top-controls-bar,
        .hide-controls .center-controls {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Hide Mouse Cursor when Controls are Hidden on Desktop */
        .hide-controls {
            cursor: none;
        }

        .top-controls-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 25;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .top-controls-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe, 
        .video-wrapper div#ytPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: 0;
            pointer-events: none;
        }

        .center-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 22;
        }

        .btn-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--control-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn-circle:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-circle.play-btn {
            width: 64px;
            height: 64px;
            font-size: 26px;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .full-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        .player-info-section {
            padding: 20px;
            background: transparent;
        }

        .watching-tag {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-sub);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .video-main-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            line-height: 1.35;
            word-break: break-word;
        }

        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-display {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .seek-bar {
            width: 100%;
            accent-color: #ff3b30;
            cursor: pointer;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ff3b30;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
            cursor: pointer;
        }

        .speed-select {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 12px;
            border-radius: 20px;
            padding: 4px 10px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .speed-select option {
            background: #161b22;
            color: #fff;
        }

        .quality-badge {
            font-size: 11px;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .live-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 48, 0.15);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
        }

        .live-btn .dot {
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
        }

        .live-btn.is-live {
            background: rgba(255, 0, 0, 0.2);
            color: #ffffff;
        }

        .live-btn.is-live .dot {
            background-color: #ff0000;
            box-shadow: 0 0 6px #ff0000;
        }

        /* Small Watermark Badge */
        #watermark {
            position: absolute;
            z-index: 15;
            color: rgba(255, 255, 255, 0.4);
            font-size: 9px;
            font-weight: 500;
            pointer-events: none;
            transition: all 3s ease-in-out;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(3px);
            white-space: nowrap;
        }

        :fullscreen .player-container,
        :-webkit-full-screen .player-container {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            background: #000;
            max-width: 100% !important;
        }

        :fullscreen .video-wrapper,
        :-webkit-full-screen .video-wrapper {
            height: calc(100vh - 120px) !important;
            padding-bottom: 0 !important;
        }

        .zoom-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            background: var(--card-bg);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header -->
        <div class="player-header">
            <button onclick="history.back()" class="btn btn-back">
                <i class="bi bi-arrow-left me-1"></i> Back
            </button>
            <span class="header-title">ආදරණීය ගණිතය Secure Player</span>
        </div>

        <!-- Video Player Section -->
        <div id="videoSection" class="player-container">
            <div class="video-wrapper" id="videoWrapper">
                <!-- Top Overlays -->
                <div class="top-controls-bar">
                    <span id="qualityLabel" class="quality-badge" title="Current Quality">Auto</span>
                    <div class="top-controls-right">
                        <select id="speedSelect" class="speed-select" onchange="changeSpeed(this.value)" title="Playback Speed">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                        </select>
                        <button class="control-btn" title="Mute/Unmute" onclick="toggleMute()"><i id="muteIcon" class="bi bi-volume-up-fill"></i></button>
                        <button class="control-btn" title="Full Screen" onclick="toggleCustomFullScreen()"><i class="bi bi-fullscreen"></i></button>
                    </div>
                </div>

                <!-- Watermark -->
                <div id="watermark">Loading User...</div>

                <!-- Center Controls -->
                <div class="center-controls">
                    <button class="btn-circle" title="Rewind 10s" onclick="skipSeconds(-10)"><i class="bi bi-arrow-counterclockwise"></i></button>
                    <button class="btn-circle play-btn" title="Play/Pause" onclick="togglePlay()"><i id="playIcon" class="bi bi-play-fill"></i></button>
                    <button class="btn-circle" title="Forward 10s" onclick="skipSeconds(10)"><i class="bi bi-arrow-clockwise"></i></button>
                </div>

                <!-- Full Shield Overlay for Gestures & Mouse Hover -->
                <div class="full-shield" id="gestureShield"></div>
                
                <!-- YT Player Frame -->
                <div id="ytPlayer"></div>
            </div>

            <!-- Bottom Details & Timeline Bar -->
            <div class="player-info-section">
                <div class="watching-tag">You're watching</div>
                <div class="video-main-title" id="videoTitleDisplay">Loading video title...</div>

                <div class="timeline-container">
                    <div class="timeline-header">
                        <div>
                            <span id="currentTime" class="time-display">0:00</span>
                            <span class="time-display text-muted" id="durationSeparator">/</span>
                            <span id="durationTime" class="time-display text-muted">0:00</span>
                        </div>
                        <button id="liveBtn" class="live-btn d-none" onclick="goLiveEdge()">
                            <span class="dot"></span> LIVE
                        </button>
                    </div>

                    <input type="range" id="seekBar" class="seek-bar" value="0" max="100" oninput="seekVideo(this.value)">
                </div>
            </div>
        </div>

        <!-- Zoom Section -->
        <div id="zoomSection" class="zoom-box d-none">
            <i class="bi bi-camera-video text-info fs-1 mb-3"></i>
            <h4 class="text-white mb-2">Live Zoom Class Link</h4>
            <p class="text-secondary text-sm mb-4">ඔබගේ පන්තිය Zoom ඔස්සේ සක්‍රීයව පවතී. පහත බටන් එක ක්ලික් කර පන්තියට සම්බන්ධ වන්න.</p>
            <a id="zoomJoinBtn" href="#" target="_blank" class="btn btn-info btn-lg rounded-pill px-5 fw-bold text-dark">
                <i class="bi bi-box-arrow-up-right me-2"></i> Join Zoom Class
            </a>
        </div>
    </div>

    <!-- YouTube API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const zoomUrl = urlParams.get('zoom');
        const isLiveType = urlParams.get('type') === 'live' || urlParams.get('isLive') === 'true';

        let player;
        let isMuted = false;
        let isLiveStream = false;
        let hideControlsTimeout;

        if (zoomUrl) {
            document.getElementById('videoSection').classList.add('d-none');
            document.getElementById('zoomSection').classList.remove('d-none');
            document.getElementById('zoomJoinBtn').href = decodeURIComponent(zoomUrl);
        }

        function onYouTubeIframeAPIReady() {
            if (!videoId) return;

            player = new YT.Player('ytPlayer', {
                videoId: videoId,
                playerVars: {
                    'controls': 0,
                    'cc_load_policy': 0,
                    'cc_lang_pref': 'none',
                    'modestbranding': 1,
                    'rel': 0,
                    'showinfo': 0,
                    'fs': 0,
                    'iv_load_policy': 3,
                    'disablekb': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onPlaybackQualityChange': onQualityChange
                }
            });
        }

        function updateVideoTitle() {
            if (!player || !player.getVideoData) return;
            const videoData = player.getVideoData();
            if (videoData && videoData.title) {
                document.getElementById('videoTitleDisplay').innerText = videoData.title;
            }
        }

        function onPlayerReady(event) {
            if (player.unloadModule) {
                player.unloadModule('captions');
                player.unloadModule('cc');
            }

            updateVideoTitle();

            const videoData = player.getVideoData();
            isLiveStream = isLiveType || (videoData && videoData.isLive);

            if (isLiveStream) {
                document.getElementById('durationTime').classList.add('d-none');
                document.getElementById('durationSeparator').classList.add('d-none');
                document.getElementById('liveBtn').classList.remove('d-none');
            } else {
                document.getElementById('durationTime').classList.remove('d-none');
                document.getElementById('durationSeparator').classList.remove('d-none');
                document.getElementById('liveBtn').classList.add('d-none');
            }

            updateTimer();
            setInterval(updateTimer, 500);
            updateQualityLabel();
            resetHideControlsTimer();
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('playIcon');
            if (event.data === YT.PlayerState.PLAYING) {
                playIcon.className = 'bi bi-pause-fill';
                if (player.unloadModule) {
                    player.unloadModule('captions');
                }
                updateQualityLabel();
                updateVideoTitle();
                resetHideControlsTimer();
            } else {
                playIcon.className = 'bi bi-play-fill';
                showControls();
            }
        }

        function togglePlay() {
            if (!player) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        /* Controls Show/Hide Logic */
        const videoWrapper = document.getElementById('videoWrapper');

        function showControls() {
            videoWrapper.classList.remove('hide-controls');
            resetHideControlsTimer();
        }

        function resetHideControlsTimer() {
            clearTimeout(hideControlsTimeout);
            if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                hideControlsTimeout = setTimeout(() => {
                    videoWrapper.classList.add('hide-controls');
                }, 3500); // Set to 3.5 seconds
            }
        }

        /* Desktop Cursor Movement Listener */
        videoWrapper.addEventListener('mousemove', () => {
            showControls();
        });

        /* Robust Mobile Tap Handler */
        let clickTimer = null;
        const gestureShield = document.getElementById('gestureShield');

        gestureShield.addEventListener('click', (e) => {
            if (clickTimer == null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    
                    // Toggle controls on single tap
                    if (videoWrapper.classList.contains('hide-controls')) {
                        showControls();
                    } else {
                        clearTimeout(hideControlsTimeout);
                        videoWrapper.classList.add('hide-controls');
                    }
                }, 220);
            } else {
                // Double tap play/pause
                clearTimeout(clickTimer);
                clickTimer = null;
                togglePlay();
                showControls();
            }
        });

        function skipSeconds(seconds) {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            let newTime = currentTime + seconds;
            
            if (newTime < 0) newTime = 0;
            if (newTime > duration) newTime = duration;

            player.seekTo(newTime, true);
            showControls();
        }

        function goLiveEdge() {
            if (!player || !isLiveStream) return;
            const duration = player.getDuration();
            player.seekTo(duration, true);
            player.playVideo();
        }

        function changeSpeed(speed) {
            if (!player || !player.setPlaybackRate) return;
            player.setPlaybackRate(parseFloat(speed));
            showControls();
        }

        function onQualityChange(event) {
            updateQualityLabel();
        }

        function updateQualityLabel() {
            if (!player || !player.getPlaybackQuality) return;
            const quality = player.getPlaybackQuality();
            const labelEl = document.getElementById('qualityLabel');
            
            if (quality) {
                let cleanQuality = quality.replace('hd', '').replace('small', '240p').replace('medium', '360p').replace('large', '480p');
                if (cleanQuality === '720' || cleanQuality === '1080') cleanQuality += 'p HD';
                labelEl.innerText = cleanQuality.toUpperCase();
            } else {
                labelEl.innerText = 'AUTO';
            }
        }

        function seekVideo(value) {
            if (!player) return;
            const duration = player.getDuration();
            const targetTime = (value / 100) * duration;
            player.seekTo(targetTime, true);
            showControls();
        }

        function toggleMute() {
            if (!player) return;
            const muteIcon = document.getElementById('muteIcon');
            if (isMuted) {
                player.unMute();
                muteIcon.className = 'bi bi-volume-up-fill';
            } else {
                player.mute();
                muteIcon.className = 'bi bi-volume-mute-fill';
            }
            isMuted = !isMuted;
            showControls();
        }

        function updateTimer() {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime() || 0;
            const duration = player.getDuration() || 0;

            document.getElementById('currentTime').innerText = formatTime(currentTime);

            if (isLiveStream) {
                const liveBtn = document.getElementById('liveBtn');
                const LIVE_THRESHOLD = 12;

                if (duration > 0) {
                    document.getElementById('seekBar').value = (currentTime / duration) * 100;
                }

                if (duration - currentTime <= LIVE_THRESHOLD) {
                    liveBtn.classList.add('is-live');
                } else {
                    liveBtn.classList.remove('is-live');
                }
            } else {
                document.getElementById('durationTime').innerText = formatTime(duration);
                if (duration > 0) {
                    document.getElementById('seekBar').value = (currentTime / duration) * 100;
                }
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function toggleCustomFullScreen() {
            const container = document.getElementById('videoSection');

            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
            showControls();
        }

        /* Watermark Positioning */
        const studentName = localStorage.getItem("studentName") || "Student";
        const studentId = localStorage.getItem("studentId") || "ID-Pending";
        const watermarkEl = document.getElementById("watermark");
        watermarkEl.innerText = `${studentName} (${studentId})`;

        function moveWatermark() {
            const container = document.getElementById('videoWrapper');
            if(!container) return;
            const maxX = container.clientWidth - watermarkEl.clientWidth - 15;
            const maxY = container.clientHeight - watermarkEl.clientHeight - 15;

            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));

            watermarkEl.style.left = `${randomX}px`;
            watermarkEl.style.top = `${randomY}px`;
        }
        setInterval(moveWatermark, 4000);
        moveWatermark();

        /* Security Features */
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
                (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) { 
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('copy', e => e.preventDefault());
    </script>
</body>
</html>
