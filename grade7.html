<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 07 - ආදරණීය ගණිතය පන්තිය</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f39c12;
            --bg-light: #f8f9fa;
            --text-light: #2c3e50;
            --card-light: #ffffff;
            --bg-dark: #121212;
            --text-dark: #e0e0e0;
            --card-dark: #1e1e1e;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .dark-mode .card {
            background-color: var(--card-dark);
            color: var(--text-dark);
            border-color: #333;
        }

        .header-section {
            background: linear-gradient(135deg, #4a90e2, #50e3c2);
            color: white;
            padding: 40px 0;
            border-radius: 0 0 25px 25px;
            margin-bottom: 30px;
        }

        .video-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .theme-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .notification-badge {
            position: relative;
        }

        .notification-badge .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Dynamic Header -->
    <div class="header-section text-center shadow">
        <div class="container">
            <h1 class="fw-bold animate__animated animate__fadeInDown">ආදරණීය ගණිතය පන්තිය</h1>
            <p class="lead" id="welcomeMessage">Grade 07 Video Lessons & Live Classes</p>
            
            <div class="mt-4">
                <button class="btn btn-warning fw-bold px-4 py-2 me-2" id="toggleViewBtn" onclick="toggleLiveVsRecording()">
                    <i class="fas fa-video me-2"></i>Go to Live Classes
                </button>
                <button class="btn btn-light position-relative" id="notifBtn" data-bs-toggle="modal" data-bs-target="#notificationModal">
                    <i class="fas fa-bell"></i> Notifications
                    <span class="badge bg-danger rounded-circle d-none" id="unreadBadge">•</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container mb-5">
        <!-- Recordings Section -->
        <div id="recordingsSection">
            <h3 class="mb-4 border-bottom pb-2"><i class="fas fa-play-circle text-primary me-2"></i>Recorded Lessons</h3>
            <div class="row g-4" id="videoGrid">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Live Class Section (Hidden by Default) -->
        <div id="liveSection" class="d-none text-center py-5">
            <div class="card p-5 mx-auto shadow-sm" style="max-width: 600px;">
                <i class="fas fa-broadcast-tower fa-4x text-danger mb-3"></i>
                <h2>Live Class Portal</h2>
                <p class="text-muted">Join the ongoing live zoom session below.</p>
                <div id="liveLinkContainer">
                    <button class="btn btn-success btn-lg px-5 mt-3" onclick="handleMediaLink('ZOOM_LINK_HERE')">
                        <i class="fas fa-video me-2"></i>Join Zoom Meeting Now
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Dark Mode Toggle -->
    <button class="btn btn-dark theme-toggle-btn" onclick="toggleDarkMode()" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Notification Modal -->
    <div class="modal fade" id="notificationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-bell me-2"></i>Notifications</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="notificationList">
                    <p class="text-muted text-center">No notifications available.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://mathswithmalindasirweb-default-rtdb.firebaseio.com"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. Personalization & Greetings
        const studentName = localStorage.getItem('studentName') || 'ගණිත සිසුවා';
        document.getElementById('welcomeMessage').innerText = `සාදරයෙන් පිළිගනිමු ${studentName}! (Grade 07)`;

        // 3. Dynamic Video Fetcher (Grade 07 Node)
        const gradePath = 'grades/grade07';
        
        function loadVideos() {
            const videoGrid = document.getElementById('videoGrid');
            db.ref(gradePath).on('value', (snapshot) => {
                videoGrid.innerHTML = '';
                const data = snapshot.val();
                
                if (!data) {
                    videoGrid.innerHTML = '<p class="text-center text-muted">වීඩියෝ පාඩම් තවම එකතු කර නැත.</p>';
                    return;
                }

                Object.keys(data).forEach(key => {
                    const item = data[key];
                    const cardHtml = `
                        <div class="col-md-4 col-sm-6">
                            <div class="card video-card h-100">
                                <img src="${item.thumbnail || 'https://via.placeholder.com/300x180'}" class="card-img-top" alt="Thumbnail">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title fw-bold">${item.title || 'Untitled Lesson'}</h5>
                                    <p class="card-text text-muted small">${item.description || ''}</p>
                                    <button onclick="handleMediaLink('${item.url}')" class="btn btn-primary mt-auto w-100">
                                        <i class="fas fa-play me-2"></i>නරඹන්න
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    videoGrid.innerHTML += cardHtml;
                });
            });
        }

        // 4. Media Link Handler
        function handleMediaLink(url) {
            if (!url) return;
            
            if (url.includes('zoom.us')) {
                window.open(url, '_blank');
            } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be')) {
                    videoId = url.split('/').pop();
                } else {
                    const urlParams = new URLSearchParams(new URL(url).search);
                    videoId = urlParams.get('v');
                }
                window.location.href = `watch.html?v=${videoId}`;
            } else {
                window.open(url, '_blank');
            }
        }

        // 5. Live vs Recording Toggle
        let isShowingLive = false;
        function toggleLiveVsRecording() {
            isShowingLive = !isShowingLive;
            const recSec = document.getElementById('recordingsSection');
            const liveSec = document.getElementById('liveSection');
            const toggleBtn = document.getElementById('toggleViewBtn');

            if (isShowingLive) {
                recSec.classList.add('d-none');
                liveSec.classList.remove('d-none');
                toggleBtn.innerHTML = '<i class="fas fa-film me-2"></i>Go Back to Recordings';
            } else {
                liveSec.classList.add('d-none');
                recSec.classList.remove('d-none');
                toggleBtn.innerHTML = '<i class="fas fa-video me-2"></i>Go to Live Classes';
            }
        }

        // 6. Notification System (24-Hour Auto Cleanup)
        function loadNotifications() {
            const studentId = localStorage.getItem('studentId') || 'all';
            const now = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;

            db.ref('notifications').on('value', (snapshot) => {
                const notifList = document.getElementById('notificationList');
                const badge = document.getElementById('unreadBadge');
                notifList.innerHTML = '';
                let count = 0;

                snapshot.forEach((child) => {
                    const notif = child.val();
                    const notifKey = child.key;

                    if (now - notif.timestamp > twentyFourHours) {
                        db.ref(`notifications/${notifKey}`).remove();
                        return;
                    }

                    if (notif.target === 'all' || notif.target === 'grade07' || notif.target === studentId) {
                        count++;
                        const itemHtml = `
                            <div class="alert alert-info mb-2">
                                <h6>${notif.title}</h6>
                                <p class="mb-0 small">${notif.message}</p>
                            </div>
                        `;
                        notifList.innerHTML += itemHtml;
                    }
                });

                if (count > 0) {
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                    notifList.innerHTML = '<p class="text-muted text-center">නව නිවේදන නොමැත.</p>';
                }
            });
        }

        // 7. Dark Mode Toggle
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const themeBtn = document.getElementById('themeToggle');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                themeBtn.className = 'btn btn-light theme-toggle-btn';
            } else {
                themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                themeBtn.className = 'btn btn-dark theme-toggle-btn';
            }
        }

        // Initialize Page
        window.onload = function() {
            loadVideos();
            loadNotifications();
        };
    </script>
</body>
</html>
