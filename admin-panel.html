<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - User Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Live User Tracking Dashboard</h1>
            <span id="userCount" class="bg-blue-600 text-white px-4 py-1 rounded-full text-sm">Loading...</span>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
            <table class="w-full text-left">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="px-6 py-4">Student ID</th>
                        <th class="px-6 py-4">Name</th>
                        <th class="px-6 py-4">Current Page</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Last Active</th>
                    </tr>
                </thead>
                <tbody id="trackingTableBody" class="divide-y divide-gray-200">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

    <script>
        // --- ADMIN LOGIN SECURITY ---
      //  const adminUser = "admin";       // Set your admin username
     //   const adminPass = "malinda123";  // Set your admin password

    //    const enteredUser = prompt("Admin Username එක ඇතුළත් කරන්න:");
    //    const enteredPass = prompt("Admin Password එක ඇතුළත් කරන්න:");

    //    if (enteredUser !== adminUser || enteredPass !== adminPass) {
    //        alert("වැරදි දත්ත! ඔබට මෙම පිටුව බැලීමට අවසර නැත.");
    //        window.location.href = "index.html"; // Redirect to login if wrong
   //     }
        // ----------------------------

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBkC75ZGm1iXXYdKR8lDNIP_l27RR5b8fM",
            authDomain: "mathswithmalindasirweb.firebaseapp.com",
            databaseURL: "https://mathswithmalindasirweb-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mathswithmalindasirweb",
            storageBucket: "mathswithmalindasirweb.firebasestorage.app",
            messagingSenderId: "806771086827",
            appId: "1:806771086827:web:55978c72cac010a3d935ae",
            measurementId: "G-HDNBFV1V96"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Reference to users node
        const usersRef = db.ref("users");

        // Real-time data listener
        usersRef.on("value", (snapshot) => {
            const tableBody = document.getElementById("trackingTableBody");
            const userCount = document.getElementById("userCount");
            tableBody.innerHTML = "";

            const users = snapshot.val();
            if (!users) {
                tableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No users found</td></tr>`;
                userCount.innerText = "Active Users: 0";
                return;
            }

            userCount.innerText = `Active Users: ${Object.keys(users).length}`;

            for (const id in users) {
                const user = users[id];
                const lastActive = user.last_active || "Just now";
                const row = `
                    <tr class="hover:bg-blue-50 transition-colors">
                        <td class="px-6 py-4 font-semibold text-blue-600">${id}</td>
                        <td class="px-6 py-4 text-gray-700">${user.name || "-"}</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-gray-100 rounded-md text-xs font-medium">${user.page || "-"}</span>
                        </td>
                        <td class="px-6 py-4">
                            <span class="flex items-center text-green-500 font-bold">
                                <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                                Online
                            </span>
                        </td>
                        <td class="px-6 py-4 text-gray-500 text-sm">${lastActive}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            }
        });
    </script>

</body>
</html>
