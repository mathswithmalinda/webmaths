<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Grade 11 - ආද❤️ණීය ගණිතය පන්තිය</title>
    <link rel="icon" type="image/x-icon" href="pic2.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
    <style>
      body.dark-mode { background-color: #121212 !important; color: #ffffff !important; }
      .dark-mode .card { background-color: #1e1e1e !important; color: #ffffff !important; }
      .dark-mode .btn-outline-primary { border-color: #ffffff !important; color: #ffffff !important; }
      .dark-mode .navbar { background-color: #1e1e1e !important; border-bottom: 1px solid #333 !important; }
      #darkModeToggle { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
      
      .text-gradient { 
        background: linear-gradient(45deg, #007bff, #00d4ff);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent; 
      }
      .cursor-pointer { cursor: pointer; }
      
      /* Red Light Pulsing Style */
      .red-dot {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 12px;
        height: 12px;
        background-color: #ff0055;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 0 8px #ff0055;
        animation: pulse-red 1.5s infinite;
      }
      @keyframes pulse-red {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 0, 85, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
      }
    </style>
  </head>

  <body class="d-flex flex-column h-100 bg-light">
    <main class="flex-shrink-0">
      <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-sm">
        <div class="container px-5">
          <a class="navbar-brand" href="#"><span class="fw-bolder text-primary">ආද❤️ණීය ගණිතය පන්තිය</span></a>
          
          <div class="d-flex align-items-center ms-auto me-3">
            <!-- Notification Bell Icon with Red Light Indicator -->
            <div class="position-relative cursor-pointer p-2" id="notifBellBtn" data-bs-toggle="modal" data-bs-target="#notifModal">
                <i class="bi bi-bell-fill fs-4 text-primary"></i>
                <span id="redLightDot" class="red-dot" style="display: none;"></span>
            </div>
          </div>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
              <li class="nav-item"><a class="nav-link" href="service.html">Service</a></li>
              <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <section class="py-5">
        <div class="container px-5 mb-5 text-center">
          <h1 class="display-5 fw-bolder mb-0"><span class="text-gradient d-inline">Grade 11</span></h1>
          <h1 class="display-5 fw-bolder mb-4"><span class="text-gradient d-inline">Recordings</span></h1>
          <h3 id="welcome-message" class="text-primary mt-3 mb-4"></h3>

          <div class="mb-4">
            <button id="toggleLiveBtn" class="btn btn-primary rounded-pill px-4">Go to Live Classes</button>
            <button id="toggleRecBtn" class="btn btn-secondary rounded-pill px-4" style="display:none;">Go Back to Recordings</button>
          </div>

          <div id="recordingsSection">
            <div class="text-center py-5">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2">Loading Recordings...</p>
            </div>
          </div>

          <div id="liveClassSection" style="display:none;">
            <div class="card shadow rounded-4 border-0 p-5">
              <h3 class="fw-bolder mb-3">Live Class</h3>
              <p class="text-muted small">පහත Join Now බටන් එක හරහා 11 වසර සජීවී පන්තියට සම්බන්ධ විය හැක.</p>
              <center>
                <button id="goLiveBtn" class="btn btn-outline-primary btn-lg rounded-pill px-5">Join Now</button>
              </center>
            </div>
          </div>
        </div>
      </section>

      <button id="darkModeToggle" class="btn btn-dark rounded-circle shadow-lg"><i class="bi bi-moon-fill"></i></button>

      <!-- NOTIFICATION MODAL -->
      <div class="modal fade" id="notifModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fw-bold text-primary"><i class="bi bi-bell-fill me-2"></i>Notifications</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="notifList">
              <p class="text-muted text-center py-3">නොටිෆිකේෂන් කිසිවක් නැත.</p>
            </div>
          </div>
        </div>
      </div>

      <footer class="bg-white py-4 mt-auto border-top">
        <div class="container px-5 text-center small">&copy; ආද❤️ණීය ගණිතය පන්තිය - Wishwa Tech 2026</div>
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
      import { getDatabase, ref, onValue, get, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBkC75ZGm1iXXYdKR8lDNIP_l27RR5b8fM",
        authDomain: "mathswithmalindasirweb.firebaseapp.com",
        projectId: "mathswithmalindasirweb",
        databaseURL: "https://mathswithmalindasirweb-default-rtdb.asia-southeast1.firebasedatabase.app",
        storageBucket: "mathswithmalindasirweb.firebasestorage.app",
        messagingSenderId: "806771086827",
        appId: "1:806771086827:web:55978c72cac010a3d935ae"
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const recSection = document.getElementById("recordingsSection");
      const liveSection = document.getElementById("liveClassSection");
      const toLive = document.getElementById("toggleLiveBtn");
      const toRec = document.getElementById("toggleRecBtn");

      // Dynamic Media Router (Zoom or Secure Youtube Player)
      window.handleMediaLink = function(rawUrl) {
        if (!rawUrl || rawUrl.trim() === "") return;
        const url = rawUrl.trim();

        if (url.includes("zoom.us")) {
          window.location.href = url;
          return;
        }

        const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(regExp);
        const ytId = (match && match[1]) ? match[1] : null;

        if (ytId) {
          window.location.href = `watch.html?v=${ytId}`;
        } else {
          window.open(url, "_blank");
        }
      };

      // Greeting with Student Name & Fetch Student ID
      const studentName = localStorage.getItem("studentName") || "Student";
      const studentClassId = localStorage.getItem("studentId") || ""; 
      document.getElementById("welcome-message").textContent = `Hello, ${studentName} 👋`;

      // Fetch Recordings with Access Filtering Logic
      async function loadRecordings() {
        let studentSubCourses = { theory: true, paper: true }; // Default Access

        // 1. Fetch logged-in student's subCourses access from Firebase
        if (studentClassId) {
          try {
            const userSnap = await get(ref(db, `users/${studentClassId}`));
            if (userSnap.exists()) {
              const userData = userSnap.val();
              if (userData.subCourses) {
                studentSubCourses = userData.subCourses;
              }
            }
          } catch (err) {
            console.error("Error fetching student profile:", err);
          }
        }

        // 2. Listen to Videos and filter based on category and student access
        onValue(ref(db, "grades/grade11"), (snapshot) => {
          const data = snapshot.val();
          recSection.innerHTML = ""; 

          if (!data) {
            recSection.innerHTML = "<div class='p-5 text-muted'>දැනට පටිගත කිරීම් කිසිවක් නොමැත.</div>";
            return;
          }

          let hasAccessibleVideos = false;

          Object.keys(data).forEach((key) => {
            const item = data[key];
            const videoCategory = item.category || "both"; // 'theory', 'paper', or 'both'

            // Check if student has access to this video
            let canAccess = false;
            if (videoCategory === "both") {
              canAccess = true;
            } else if (videoCategory === "theory" && studentSubCourses.theory) {
              canAccess = true;
            } else if (videoCategory === "paper" && studentSubCourses.paper) {
              canAccess = true;
            }

            if (item.active && canAccess) {
              hasAccessibleVideos = true;
              const card = document.createElement("div");
              card.className = "card overflow-hidden shadow-sm rounded-4 border-0 mb-4";
              card.innerHTML = `
                <div class="card-body p-4 text-center">
                  <h2 class="fw-bolder mb-3">${item.title}</h2>
                  <button class="btn btn-outline-primary rounded-pill px-4" onclick="window.handleMediaLink('${item.url}')">
                    <i class="bi bi-play-circle-fill"></i> View Video
                  </button>
                </div>`;
              recSection.appendChild(card);
            }
          });

          if (!hasAccessibleVideos) {
            recSection.innerHTML = "<div class='p-5 text-muted'>ඔබට අදාළ පන්ති පටිගත කිරීම් කිසිවක් නොමැත.</div>";
          }
        });
      }

      // Initialize Recordings Filter
      loadRecordings();

      // Notifications Listener with Unread State Tracking
      const notifList = document.getElementById("notifList");
      const redLightDot = document.getElementById("redLightDot");
      const notifBellBtn = document.getElementById("notifBellBtn");

      onValue(ref(db, "notifications"), (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          redLightDot.style.display = "none";
          notifList.innerHTML = "<p class='text-muted text-center py-3'>නොටිෆිකේෂන් කිසිවක් නැත.</p>";
          return;
        }

        const now = Date.now();
        const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
        let activeItems = [];
        let hasUnread = false;

        const lastSeenTime = parseInt(localStorage.getItem("notifLastSeenTime") || "0");

        const processItems = (itemsObj, pathPrefix) => {
          if (!itemsObj) return;
          Object.keys(itemsObj).forEach(key => {
            const item = itemsObj[key];
            const created = item.createdAt || 0;

            if (now - created > TWENTY_FOUR_HOURS) {
              remove(ref(db, `notifications/${pathPrefix}/${key}`));
            } else {
              activeItems.push(item);
              if (created > lastSeenTime) {
                hasUnread = true;
              }
            }
          });
        };

        // 1. Global Notifications
        processItems(data.global, "global");

        // 2. Grade 11 Notifications
        processItems(data.grade11, "grade11");

        // 3. Student Specific Notifications
        if (studentClassId && data.students && data.students[studentClassId]) {
          processItems(data.students[studentClassId], `students/${studentClassId}`);
        }

        // Render Red Light Dot
        if (hasUnread) {
          redLightDot.style.display = "block";
        } else {
          redLightDot.style.display = "none";
        }

        // Render Items inside Modal
        if (activeItems.length > 0) {
          activeItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          notifList.innerHTML = "";

          activeItems.forEach(n => {
            const dateStr = n.createdAt ? new Date(n.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
            const linkBtn = n.link ? `<br/><button onclick="window.handleMediaLink('${n.link}')" class="btn btn-sm btn-primary mt-2 rounded-pill">Open Link</button>` : '';

            notifList.innerHTML += `
              <div class="border-bottom pb-2 mb-2 text-start">
                <div class="d-flex justify-content-between align-items-center">
                  <strong class="text-dark">${n.title}</strong>
                  <small class="text-muted" style="font-size: 11px;">${dateStr}</small>
                </div>
                <p class="mb-1 text-secondary small">${n.message}</p>
                ${linkBtn}
              </div>
            `;
          });
        } else {
          notifList.innerHTML = "<p class='text-muted text-center py-3'>නොටිෆිකේෂන් කිසිවක් නැත.</p>";
        }
      });

      // Clear Red Light when clicking Bell Button and save timestamp
      notifBellBtn.addEventListener("click", () => {
        redLightDot.style.display = "none";
        localStorage.setItem("notifLastSeenTime", Date.now().toString());
      });

      // View Switcher
      toLive.onclick = () => {
        recSection.style.display = "none";
        liveSection.style.display = "block";
        toLive.style.display = "none";
        toRec.style.display = "inline-block";
      };
      toRec.onclick = () => {
        recSection.style.display = "block";
        liveSection.style.display = "none";
        toLive.style.display = "inline-block";
        toRec.style.display = "none";
      };

      document.getElementById("darkModeToggle").onclick = () => document.body.classList.toggle("dark-mode");
    </script>
  </body>
</html>
