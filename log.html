<!-- Firebase Login Script -->
<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBkC75ZGm1iXXYdKR8lDNIP_l27RR5b8fM",
    authDomain: "mathswithmalindasirweb.firebaseapp.com",
    databaseURL: "https://mathswithmalindasirweb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mathswithmalindasirweb",
    storageBucket: "mathswithmalindasirweb.firebasestorage.app",
    messagingSenderId: "806771086827",
    appId: "1:806771086827:web:55978c72cac010a3d935ae"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const loginForm = document.getElementById("login-form");
  loginForm.addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("studentId").value.trim();
    const passcode = document.getElementById("passcode").value.trim();
    const studentName = document.getElementById("studentName").value.trim();

    const userRef = db.ref("users/" + username);
    userRef.get().then((snapshot) => {
      if(snapshot.exists()){
        const data = snapshot.val();

        if(data.passcode === passcode){
          alert("✅ Login Success");

          // 🔹 Save student name & id BEFORE redirect
          localStorage.setItem("studentName", studentName);
          localStorage.setItem("studentId", username);

          // 🔹 Update last_active in Firebase Realtime DB BEFORE redirect
          userRef.update({
            last_active: new Date().toLocaleString()
          });

          // 🔹 Redirect after everything is done
          window.location.replace(data.page); // grade11.html / grade10.html
        } else {
          alert("❌ Wrong Passcode");
        }

      } else {
        alert("❌ User Not Found");
      }
    }).catch(err=>{
      console.error(err);
      alert("Error connecting to database");
    });
  });
</script>
