  <div>

  <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200" id="log">

  <br><br>

<p id="error-message" class="text-red-600 mt-2 hidden"></p>

        <!-- Core theme JS-->
        <script>
  const allowedStudents = {
    "T1156": { passcode: "1234", page: "grade11.html" },
    "T1157": { passcode: "1234", page: "grade11.html" },
    "T1056": { passcode: "1234", page: "grade10.html" },
    "T0956": { passcode: "1234", page: "grade9.html" },
    "T0856": { passcode: "1234", page: "grade8.html" },
    "T0756": { passcode: "1234", page: "grade7.html" },
    "T0656": { passcode: "1234", page: "grade6.html" }
  };

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();

    const name = document.getElementById('studentName').value.trim();
    const id = document.getElementById('studentId').value.trim().toUpperCase();
    const passcode = document.getElementById('passcode').value.trim();
    const errorMsg = document.getElementById('error-message');

    if (allowedStudents[id] && allowedStudents[id].passcode === passcode) {
      // Save the student's name to localStorage
      localStorage.setItem("studentName", name);
      alert("Login successful!");
      window.location.href = allowedStudents[id].page;
    } else {
      errorMsg.textContent = "Invalid Student ID or Passcode";
      errorMsg.classList.remove('hidden');
    }
  });
</script>
