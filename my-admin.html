<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ආද❤️ණීය ගණිතය</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Plus Jakarta Sans', sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-primary { background: linear-gradient(45deg, #007bff, #0056b3); border: none; }
        .btn-success { background: linear-gradient(45deg, #28a745, #218838); border: none; }
        .text-gradient {
            background: linear-gradient(45deg, #007bff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card p-4 shadow">
                    <h2 class="fw-bold text-center mb-4 text-gradient">Class Admin Panel</h2>
                    
                    <div class="mb-4 bg-white p-3 rounded-4 border">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold mb-0 text-secondary"><i class="bi bi-gear-fill"></i> Manage Links</h4>
                            <button class="btn btn-success rounded-pill px-4 shadow-sm" id="addNewBtn">
                                <i class="bi bi-plus-lg"></i> Add New Class
                            </button>
                        </div>

                        <label class="fw-bold mb-2 small text-muted">පන්තිය තෝරන්න (Select Grade):</label>
                        <select id="gradeSelect" class="form-select form-select-lg rounded-3 shadow-sm border-primary">
                            <option value="grade06">Grade 06</option>
                            <option value="grade07">Grade 07</option>
                            <option value="grade08">Grade 08</option>
                            <option value="grade09">Grade 09</option>
                            <option value="grade10">Grade 10</option>
                            <option value="grade11" selected>Grade 11</option>
                        </select>
                    </div>

                    <div id="adminLinksContainer" class="row">
                        <div class="text-center p-5">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2">දත්ත ලෝඩ් වෙනවා...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit / Add Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 bg-light rounded-top-4">
                    <h5 class="modal-title fw-bold text-primary">Update Class Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editKey">
                    
                    <div class="mb-3">
                        <label class="small fw-bold text-muted">Title / Lesson Name</label>
                        <input type="text" id="editTitle" class="form-control form-control-lg rounded-3" placeholder="e.g. Day 01 - Algebra">
                    </div>
                    
                    <div class="mb-3">
                        <label class="small fw-bold text-muted">Video Link (YouTube/Cloud)</label>
                        <input type="text" id="editUrl" class="form-control form-control-lg rounded-3" placeholder="https://youtube.com/...">
                    </div>

                    <!-- Category Selection Dropdown -->
                    <div class="mb-3">
                        <label class="small fw-bold text-muted">Class Category (පන්ති වර්ගය)</label>
                        <select id="editCategory" class="form-select form-select-lg rounded-3">
                            <option value="both">Both (Theory & Paper Class)</option>
                            <option value="theory">Theory Only (Theory අයට පමණයි)</option>
                            <option value="paper">Paper Only (Paper Class අයට පමණයි)</option>
                        </select>
                    </div>
                    
                    <div class="form-check form-switch mt-3">
                        <input class="form-check-input" type="checkbox" id="editActive" checked>
                        <label class="form-check-label fw-bold">Active (ශිෂ්‍යයන්ට පෙන්වන්න)</label>
                    </div>

                    <!-- Live Stream Switch -->
                    <div class="form-check form-switch mt-2">
                        <input class="form-check-input" type="checkbox" id="editIsLive">
                        <label class="form-check-label fw-bold text-danger">
                            🔴 Is Live Stream (මෙය Live එකක් නම් සක්‍රීය කරන්න)
                        </label>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow" id="saveBtn">
                        <i class="bi bi-cloud-arrow-up-fill"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="my-logic.js"></script>
</body>
</html>
